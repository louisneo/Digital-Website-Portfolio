<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seven Literary Analyses | My Literary Journey</title>
<meta name="description" content="Seven literary analyses with title, author, literary lens, and full analysis.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;600&display=swap">
<link rel="stylesheet" href="assets/style.css"></head>
<body><main>
<h1>Seven Literary Analyses</h1>
<p class="quote" style="margin-top:1rem">Titles, authors and lenses below are examples &mdash; edit them to match your actual outputs.</p>
<div class="grid" id="index"></div>
<div id="list"></div>
</main>
<script>
const works=[
["The Iliad","Homer","Archetypal / Heroic Lens"],
["The Odyssey","Homer","Psychoanalytic Lens"],
["The Mahabharata","Vyasa","Moral-Philosophical Lens"],
["The Divine Comedy","Dante Alighieri","Religious / Allegorical Lens"],
["Beowulf","Anonymous","Historical Lens"],
["The Epic of Gilgamesh","Anonymous","Existentialist Lens"],
["The Aeneid","Virgil","Feminist Lens"]];
const idx=document.getElementById("index"),list=document.getElementById("list");
works.forEach(([t,a,l],i)=>{const n=i+1;
idx.insertAdjacentHTML("beforeend",`<a class="card" href="#a${n}"><span class="num">ANALYSIS ${String(n).padStart(2,"0")}</span><h3>${t}</h3><p>${a}</p><span class="tag">${l}</span></a>`);
list.insertAdjacentHTML("beforeend",`<article id="a${n}" class="fade"><p class="eyebrow">Analysis ${n}</p><h2>${t}</h2>
<p class="meta">Author: <span>${a}</span> &middot; Lens: <span>${l}</span></p>
<img src="assets/analysis-${n}.jpg" alt="Visual representation of ${t}" onerror="this.remove()">
<p class="todo">[Paste your complete literary analysis of ${t} here. You may improve grammar and organization without changing the substance.]</p>
<a href="#index">&uarr; Back to top</a></article>`);});
</script>
<script src="assets/site.js"></script></body></html>
